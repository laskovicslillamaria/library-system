<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvkölcsönző</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f7f7f7;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        select {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📚 Kölcsönözz könyvet!</h1>

    <div class="form-group">
        <input type="text" id="title" placeholder="Könyv címe">
        <input type="text" id="author" placeholder="Szerző">
        <button onclick="addBook()">Hozzáadás</button>
    </div>

    <div id="bookList"></div>
</div>
<hr>
<h2>👤 Olvasók</h2>

<div class="form-group">
    <input type="text" id="userName" placeholder="Név">
    <input type="text" id="userEmail" placeholder="Email">
    <button onclick="addUser()">Hozzáadás</button>
</div>

<div id="userList"></div>

<hr>
<h2>📖 Kölcsönzés</h2>

<div class="form-group">
    <select id="loanUserId"></select>
    <select id="loanBookId"></select>
    <button onclick="addLoan()">Kölcsönzés</button>
</div>

<div id="loanList"></div>

<script>
    async function loadBooks() {
    const response = await fetch('/books');
    const books = await response.json();

    const list = document.getElementById('bookList');
    const select = document.getElementById('loanBookId');

    list.innerHTML = '';
    select.innerHTML = '';

    books.forEach(book => {
        const div = document.createElement('div');
        div.className = 'book-item';

        div.innerHTML = `
            <span><strong>${book.title}</strong> - ${book.author}</span>
            <button class="delete-btn" onclick="deleteBook(${book.id})">Törlés</button>
        `;

        list.appendChild(div);

        if (book.available) {
            const option = document.createElement('option');
            option.value = book.id;
            option.textContent = book.title;
            select.appendChild(option);
        }
    });
}

    async function addBook() {
        const title = document.getElementById('title').value;
        const author = document.getElementById('author').value;

        await fetch('/books', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                title: title,
                author: author,
                available: true
            })
        });

        document.getElementById('title').value = '';
        document.getElementById('author').value = '';

        loadBooks();
    }

    async function deleteBook(id) {
        await fetch('/books/' + id, {
            method: 'DELETE'
        });

        loadBooks();
    }


    async function loadUsers() {
        const response = await fetch('/users');
        const users = await response.json();

        const list = document.getElementById('userList');
        const select = document.getElementById('loanUserId');

    list.innerHTML = '';
    select.innerHTML = '';

    users.forEach(user => {
        const div = document.createElement('div');
        div.className = 'book-item';

        div.innerHTML = `
            <span><strong>${user.name}</strong> - ${user.email}</span>
            <button class="delete-btn" onclick="deleteUser(${user.id})">Törlés</button>
        `;

        list.appendChild(div);

        const option = document.createElement('option');
        option.value = user.id;
        option.textContent = user.name;
        select.appendChild(option);
    });
}

async function addUser() {
    const name = document.getElementById('userName').value;
    const email = document.getElementById('userEmail').value;

    await fetch('/users', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            name: name,
            email: email
        })
    });

    document.getElementById('userName').value = '';
    document.getElementById('userEmail').value = '';

    loadUsers();
}

async function deleteUser(id) {
    await fetch('/users/' + id, {
        method: 'DELETE'
    });

    loadUsers();
}

async function loadLoans() {
    const response = await fetch('/loans');
    const loans = await response.json();

    const list = document.getElementById('loanList');
    list.innerHTML = '';

    loans.forEach(loan => {
        const div = document.createElement('div');
        div.className = 'book-item';

        div.innerHTML = `
            <span>
                📚 ${loan.book.title} → 👤 ${loan.user.name}
                (${loan.loanDate})
            </span>
            <button class="delete-btn" onclick="deleteLoan(${loan.id})">Törlés</button>
        `;

        list.appendChild(div);
    });
}

async function addLoan() {
    const userId = document.getElementById('loanUserId').value;
    const bookId = document.getElementById('loanBookId').value;

    await fetch('/loans', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            userId: userId,
            bookId: bookId
        })
    });

    loadLoans();
    loadBooks();
}

async function deleteLoan(id) {
    await fetch('/loans/' + id, {
        method: 'DELETE'
    });

    loadLoans();
}


    loadBooks();
    loadUsers();
    loadLoans();
</script>

</body>
</html>
