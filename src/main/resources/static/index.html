<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#74ebd5,#9face6);
            min-height:100vh;
            padding:30px;
        }

        header{
            text-align:center;
            color:white;
            margin-bottom:30px;
        }

        header h1{
            font-size:42px;
        }

        .login-box{
            background:white;
            padding:20px;
            border-radius:20px;
            max-width:400px;
            margin:0 auto 40px auto;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        input, button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{
            background:#4CAF50;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#43a047;
        }

        #welcome{
            text-align:center;
            color:white;
            font-size:20px;
            margin-bottom:20px;
        }

        .book-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .book-card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
            transition:0.2s;
        }

        .book-card:hover{
            transform:translateY(-5px);
        }

        .book-card img{
            width:100%;
            height:320px;
            object-fit:cover;
        }

        .book-info{
            padding:15px;
        }

        .book-info h3{
            margin-bottom:8px;
        }

        .book-info p{
            color:#666;
            margin-bottom:12px;
        }

        .hidden{
            display:none;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Library System</h1>
    <p>Kölcsönözz könyveket egyszerűen</p>
</header>

<div class="login-box" id="loginBox">
    <h2>👤 Bejelentkezés</h2>
    <input type="text" id="username" placeholder="Neved">
    <button onclick="login()">Belépés</button>
</div>

<div id="welcome" class="hidden"></div>

<div class="book-grid" id="bookGrid"></div>

<script>
    let currentUser = null;

    function login(){
        const name = document.getElementById("username").value;

        if(name.trim() === ""){
            alert("Adj meg nevet!");
            return;
        }

        currentUser = name;

        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("welcome").classList.remove("hidden");
        document.getElementById("welcome").innerHTML =
            "Üdv, <b>" + currentUser + "</b> 👋";
    }

    async function loadBooks(){
        const response = await fetch('/books');
        const books = await response.json();

        const grid = document.getElementById("bookGrid");
        grid.innerHTML = "";

        const images = [
            "https://images.unsplash.com/photo-1544947950-fa07a98d237f",
            "https://images.unsplash.com/photo-1512820790803-83ca734da794",
            "https://images.unsplash.com/photo-1521587760476-6c12a4b040da",
            "https://images.unsplash.com/photo-1495446815901-a7297e633e8d"
        ];

        books.forEach((book,index) => {
            const card = document.createElement("div");
            card.className = "book-card";

            card.innerHTML = `
                <img src="${images[index % images.length]}">
                <div class="book-info">
                    <h3>${book.title}</h3>
                    <p>${book.author}</p>
                    ${
                        book.available
                        ? `<button onclick="borrowBook(${book.id})">Kölcsönzés</button>`
                        : `<button disabled>Nem elérhető</button>`
                    }
                </div>
            `;

            grid.appendChild(card);
        });
    }

    async function borrowBook(bookId){
        if(currentUser == null){
            alert("Előbb jelentkezz be!");
            return;
        }

        const usersResponse = await fetch('/users');
        let users = await usersResponse.json();

        let user = users.find(u => u.name === currentUser);

        if(!user){
            const createUser = await fetch('/users', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    name: currentUser,
                    email: currentUser + "@mail.com"
                })
            });

            user = await createUser.json();
        }

        await fetch('/loans', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                userId:user.id,
                bookId:bookId
            })
        });

        alert("Sikeres kölcsönzés!");
        loadBooks();
    }

    loadBooks();
</script>

</body>
</html>
