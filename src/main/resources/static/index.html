    <title>🐉 Dragon Shelf</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Times New Roman, sans-serif;
            min-height:100vh;
            padding:30px;
            background-image:url('wallpaperflare.com_wallpaper.jpg');
            background-size:cover;
            background-position:center;
            background-attachment:fixed;
            color:white;
        }

        body::before{
            content:"";
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.45);
            z-index:-1;
        }

        header{
            text-align:center;
            margin-bottom:40px;
        }

        header h1{
            font-size:64px;
            color:#ffcc66;
            text-shadow:0 0 15px #ff6600;
        }

        header p{
            font-size:24px;
            color:#ffd699;
            margin-top:10px;
        }

        .login-box{
            max-width:700px;
            margin:0 auto 50px auto;
            padding:25px;
            background:rgba(20,0,0,0.75);
            border:2px solid #ff5500;
            border-radius:20px;
            box-shadow:0 0 20px rgba(255,80,0,0.5);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:15px;
            color:#ffcc66;
        }

        .login-row{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:14px;
            border:none;
            border-radius:10px;
            font-size:18px;
        }

        button{
            padding:14px 22px;
            border:none;
            border-radius:10px;
            background:#ff5500;
            color:white;
            font-size:18px;
            cursor:pointer;
            box-shadow:0 0 10px rgba(255,100,0,0.7);
            transition:0.2s;
        }

        button:hover{
            background:#ff7700;
            transform:scale(1.03);
        }

        #welcome{
            text-align:center;
            font-size:24px;
            margin-bottom:30px;
            color:#ffdd99;
        }

        .books-section{
            display:flex;
            flex-direction:row;
            justify-content:center;
            align-items:flex-start;
            gap:25px;
            flex-wrap:wrap;
            width:100%;
            margin-top:50px;
        }

        .book-card{
            width: 220px;
            background: rgba(0,0,0,0.65);
            border: 2px solid #ff6600;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,100,0,0.4);
            transition: 0.3s;
        }

        .book-card:hover{
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 0 30px rgba(255,120,0,0.8);
        }

        .book-card img{
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 12px;
        }

        .book-card h3{
            color: #ffd27a;
            margin: 12px 0 6px;
            font-size: 24px;
        }

        .book-card p{
            color: #ddd;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .book-card button{
            background: linear-gradient(45deg,#ff6600,#ff9900);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .book-card button:hover{
            filter: brightness(1.15);
        }

        .book-info{
            padding:15px;
            text-align:center;
        }

        .book-info h3{
            font-size:28px;
            color:#ffd27f;
            margin-bottom:8px;
        }

        .book-info p{
            color:#ddd;
            margin-bottom:15px;
            font-size:18px;
        }

        .hidden{
            display:none;
        }

        .disabled-btn{
            background:#555;
            box-shadow:none;
            cursor:not-allowed;
        }
    </style>

<body>

<header>
    <h1>🐉 Dragon Shelf</h1>
    <p>Varázslatos könyvkölcsönzés egy helyen</p>
</header>

<div class="login-box" id="loginBox">
    <h2>👤 Bejelentkezés</h2>

    <div class="login-row">
        <input type="text" id="username" placeholder="Neved">
        <button onclick="login()">Belépés</button>
    </div>
</div>
<div id="welcome" class="hidden"></div>

<div class="books-section">
<div class="book-card">
    <img src="book_images/HarryPotter.png" alt="Harry Potter">
    <h3>Harry Potter</h3>
    <p>J.K. Rowling</p>
    <button>Kölcsönzés</button>
</div>

<div class="book-card">
    <img src="book_images/GyurukUra.png" alt="Gyűrűk Ura">
    <h3>A Gyűrűk Ura</h3>
    <p>J.R.R. Tolkien</p>
    <button>Kölcsönzés</button>
</div>
</div>

<div class="books-section" id="bookGrid"></div>

<script>
    let currentUser = null;

    function login(){
        const name = document.getElementById("username").value;

        if(name.trim() === ""){
            alert("Adj meg nevet!");
            return;
        }

        currentUser = name;

        document.getElementById("loginBox").classList.add("hidden");
        const welcome = document.getElementById("welcome");
        welcome.classList.remove("hidden");
        welcome.innerHTML = "Üdv újra, <b>" + currentUser + "</b> 🐉";
    }

    async function loadBooks(){
        const response = await fetch('/books');
        const books = await response.json();

        const grid = document.getElementById("bookGrid");
        grid.innerHTML = "";

        const images = [
            "https://images.unsplash.com/photo-1512820790803-83ca734da794",
            "https://images.unsplash.com/photo-1544947950-fa07a98d237f",
            "https://images.unsplash.com/photo-1521587760476-6c12a4b040da",
            "https://images.unsplash.com/photo-1495446815901-a7297e633e8d"
        ];

        books.forEach((book,index)=>{

            const available = book.available === true;

            const card = document.createElement("div");
            card.className = "book-card";

            card.innerHTML = `
                <img src="${images[index % images.length]}">
                <div class="book-info">
                    <h3>${book.title}</h3>
                    <p>${book.author}</p>
                    ${
                        available
                        ? `<button onclick="borrowBook(${book.id})">Kölcsönzés</button>`
                        : `<button class="disabled-btn" disabled>Nem elérhető</button>`
                    }
                </div>
            `;

            grid.appendChild(card);
        });
    }

    async function borrowBook(bookId){

        if(currentUser == null){
            alert("Előbb jelentkezz be!");
            return;
        }

        const usersResponse = await fetch('/users');
        let users = await usersResponse.json();

        let user = users.find(u => u.name === currentUser);

        if(!user){
            const createUser = await fetch('/users', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({
                    name: currentUser,
                    email: currentUser + "@mail.com"
                })
            });

            user = await createUser.json();
        }

        await fetch('/loans', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
                userId:user.id,
                bookId:bookId
            })
        });

        alert("Sikeres kölcsönzés! 📚");
        loadBooks();
    }

    loadBooks();
</script>

</body>
